<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - La Logia de Miga & Taza</title>
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>
    <a href="../index.html" class="volver">← Volver</a>

    <main>
        <div class="registro-card">
            <div class="logo-container">
                <img src="../café.png.png" alt="">
            </div>
            
            <h2>Crea tu cuenta</h2>
            <p>Únete a nuestra comunidad cafetera</p>

            <form action="confirmacion.html" method="GET">
                <div class="campo">
                    <label>Usuario</label>
                    <input type="text" name="usuario" placeholder="Ej: JuanPerez" required>
                </div>

                <div class="campo">
                    <label>Correo electrónico</label>
                    <input type="email" name="correo" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="campo">
                    <label>Contraseña</label>
                    <input type="password" name="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-registrar">REGISTRARSE</button>
            </form>
        </div>
    </main>
</body>
</html>
