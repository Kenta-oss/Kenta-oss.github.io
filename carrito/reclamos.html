<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libro de Reclamaciones</title>
    <link rel="stylesheet" href="../css/reclamos.css">
</head>
<body>

    <form class="caja-formulario">
        <h2>Libro de Reclamaciones</h2>
        
        <label class="etiqueta">Nombre:</label>
        <input type="text" class="campo-texto" required>

        <label class="etiqueta">DNI:</label>
        <input type="text" class="campo-texto" required pattern="[0-9]{8}">

        <label class="etiqueta">Tipo:</label>
        <select class="campo-texto" required>
            <option value="">Seleccione...</option>
            <option value="queja">Queja</option>
            <option value="reclamo">Reclamo</option>
        </select>

        <label class="etiqueta">Mensaje:</label>
        <textarea class="campo-texto" rows="4" required></textarea>

        <input type="submit" value="Enviar" class="boton-enviar">
    </form>

</body>
</html>
