<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
</head>
<body class="cuerpo-carrito">

    <a href="../index.html" class="boton-regreso">Regreso</a>

    <div class="contenedor-compra">
        <h2>Detalle del Pedido</h2>
        
        <form action="" method="get">
        <div class="grupo-input">
            <label>Alimentos</label>
            <select class="control-formulario">
                <option value="Opcion 1">Triple de tocino</option>
                <option value="Opcion 2">Galleta de Chocochips</option>
                <option value="Opcion 3">Torta de Chocolate</option>
                <option value="Opcion 4">Croissant con Jamón y Queso</option>
                <option value="Opcion 5">Keke de Zanahoria</option>
                <option value="Opcion 6">Dona con Chispas</option>
                <option value="Opcion 7">Croissant de Mantequilla</option>
                <option value="Opcion 8">Keke de Piña</option>
                <option value="Opcion 9">Sándwich de chicharrón</option>
            </select>
            <label>Cantidad:</label>
            <input type="number" class="control-formulario" min="0">
            </div>

            <div class="grupo-input">
            <label>Bebida</label>
            <select class="control-formulario">
                <option value="Opcion 1">Café</option>
                <option value="Opcion 2">Mocachino</option>
                <option value="Opcion 3">Jugo de Fresa</option>
                <option value="Opcion 4">Café Espresso</option>
                <option value="Opcion 5">Jugo Especial</option>
                <option value="Opcion 6">Té de Manzana</option>
                <option value="Opcion 7">Chocolate Caliente</option>
                <option value="Opcion 8">Jugo Especial</option>
                <option value="Opcion 9">Té de Manzana</option>
            </select>
            <label>Cantidad:</label>
            <input type="number" class="control-formulario" min="0">
            </div>

            <div class="grupo-input">
            <label>Tamaño del envase</label>
            <select class="control-formulario">
                <option value="Opcion 1">Pequeño</option>
                <option value="Opcion 2">Mediano</option>
                <option value="Opcion 3">Grande</option>
            </select>
            </div>

            <div class="grupo-confirmar">
                <label>Confirmar compra</label>
                <input type="submit" id="btn-confirmar" value="CONFIRMAR"/>
            </div>
        </form>
    </div>
</body>
</html>
