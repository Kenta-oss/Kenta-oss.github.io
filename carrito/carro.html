<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - La Logia de Miga & Taza</title>
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body class="cuerpo-carrito">

    <div class="contenedor-principal">
        <a href="../index.html" class="boton-regreso">← Volver a la tienda</a>
        
        <div class="flex-carrito">
            <div class="seccion-productos">
                <h2>🛒 Carrito de compras</h2>
                
                <div class="fila-producto">
                    <div class="info-prod">
                        <label>Alimentos</label>
                        <select class="control-formulario">
                            <option>Triple de tocino</option>
                            <option>Galleta de Chocochips</option>
                            <option>Torta de Chocolate</option>
                        </select>
                    </div>
                    <div class="info-cantidad">
                        <label>Cantidad</label>
                        <input type="number" class="control-formulario" value="1" min="0">
                    </div>
                </div>

                <div class="fila-producto">
                    <div class="info-prod">
                        <label>Bebida</label>
                        <select class="control-formulario">
                            <option>Café Americano</option>
                            <option>Mocachino</option>
                            <option>Jugo de Fresa</option>
                        </select>
                    </div>
                    <div class="info-cantidad">
                        <label>Cantidad</label>
                        <input type="number" class="control-formulario" value="1" min="0">
                    </div>
                </div>
                
                <button class="btn-vaciar">Vaciar carrito de compra</button>
            </div>

            <div class="seccion-resumen">
                <h3>Resumen</h3>
                <div class="linea-resumen">
                    <span>Subtotal</span>
                    <span>S/ 00.00</span>
                </div>
                <hr>
                <div class="linea-resumen total">
                    <span>Total</span>
                    <span>S/ 00.00</span>
                </div>
                
                <div class="check-terminos">
                    <input type="checkbox" id="terminos">
                    <label for="terminos">Acepto los Términos y Condiciones</label>
                </div>

                <input type="submit" id="btn-confirmar" value="IR A PAGAR →">
            </div>
        </div>
    </div>
</body>
</html>
